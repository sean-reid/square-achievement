name = "square_achievement"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SquareAchievement"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "SquareAchievement"
precompileModules = true

[[lean_exe]]
name = "checker"
root = "Checker"
