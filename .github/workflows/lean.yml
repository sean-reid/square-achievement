name: lean

on:
  push:
    branches: [main]
    paths: [formalization/**]
  pull_request:
    paths: [formalization/**]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization
      - run: lake exe checker 6
      - run: lake exe checker 5 five
