name: pages

on:
  push:
    branches: [main]

# Dormant until the repo goes public: set the repository variable
# DEPLOY_PAGES to "true" to activate.
jobs:
  deploy:
    if: ${{ vars.DEPLOY_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: paper/main.tex
          work_in_root_file_dir: true
      - run: |
          mkdir -p site/dist/downloads
          cp paper/main.pdf site/dist/downloads/square-achievement-paper.pdf
          git archive HEAD --prefix=square-achievement-formalization/ formalization \
            -o site/dist/downloads/square-achievement-formalization.tar.gz
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
