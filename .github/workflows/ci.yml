name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tables: ${{ steps.filter.outputs.tables }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tables:
              - pipeline/**
              - formalization/**/Data/**
              - site/src/game/*.json
              - .github/workflows/ci.yml

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/dist

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check squares
      - run: uvx ruff format --check squares
      - run: uv run --with pytest python -m pytest squares -q

  # regenerating the tables takes six minutes, so it runs only when
  # something that feeds them changed, and on the weekly full run
  tables:
    needs: changes
    if: github.event_name != 'pull_request' && github.event_name != 'push' || needs.changes.outputs.tables == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run python -m squares.threshold.crosscheck
      - run: uv run python -m squares.threshold.export_lean
      - run: uv run python -m squares.threshold.export_site
      - run: uv run python -m squares.smallboard
      - run: git diff --exit-code --stat

  paper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        paper: [threshold]
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: papers/${{ matrix.paper }}/main.tex
          work_in_root_file_dir: true
      - uses: actions/upload-artifact@v7
        with:
          name: paper-${{ matrix.paper }}
          path: papers/${{ matrix.paper }}/main.pdf
