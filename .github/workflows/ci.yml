name: ci

# Every check runs on pull requests, on pushes to main, weekly, and on
# demand. The Lean build has its own workflow.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/dist

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check squares
      - run: uvx ruff format --check squares
      - run: uv run --with pytest python -m pytest squares -q

  tables:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run python -m squares.five.crosscheck
      - run: uv run python -m squares.five.export_lean
      - run: uv run python -m squares.five.export_site
      - run: uv run python -m squares.smallboard
      - run: uv run python -m squares.plus.export_site
      - run: uv run python -m squares.paper.figures
      - run: uv run python -m squares.paper.claims
      - run: git diff --exit-code --stat

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: paper/main.tex
          work_in_root_file_dir: true
      - uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/main.pdf
