name: ci

# While the repository is private, every check here runs on the
# author's machine before a change merges, and Actions repeats them
# weekly and on demand rather than per pull request.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/dist

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check squares
      - run: uvx ruff format --check squares
      - run: uv run --with pytest python -m pytest squares -q

  tables:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run python -m squares.threshold.crosscheck
      - run: uv run python -m squares.threshold.export_lean
      - run: uv run python -m squares.threshold.export_site
      - run: uv run python -m squares.smallboard
      - run: git diff --exit-code --stat

  paper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        paper: [threshold, plus]
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: papers/${{ matrix.paper }}/main.tex
          work_in_root_file_dir: true
      - uses: actions/upload-artifact@v7
        with:
          name: paper-${{ matrix.paper }}
          path: papers/${{ matrix.paper }}/main.pdf
